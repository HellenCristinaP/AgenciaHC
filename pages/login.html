<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua conta na Agência HC!</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="shortcut icon" href="../imgs/logo.ico" type="image/x-icon">
</head>
<body class="bg-light">
    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-4">
        <div class="card shadow p-4 text-center" style="max-width: 28rem; width: 100%; border-radius: 1rem; border-top: 5px solid #15803d;">
            <div class="mb-3">
                <img src="../imgs/logoP.png" alt="Logo Agência HC" height="50">
            </div>
            <h1 class="h3 mb-2">Olá, <span id="nomeUsuario" class="text-success fw-bold"></span>!</h1>
            <p class="text-muted">Bem-vindo à sua conta na Agência HC</p>
            
            <div class="p-3 my-3 bg-white rounded shadow-sm border">
                <span class="text-muted d-block small">Saldo Disponível</span>
                <span id="saldo" class="display-6 fw-bold text-dark">R$ 0,00</span>
            </div>

            <div class="d-flex gap-2 justify-content-center mt-2">
                <button id="depositar" class="btn btn-success px-4">Depositar</button>
                <button id="retirar" class="btn btn-outline-secondary px-4">Retirar</button>
            </div>

            <hr class="my-4">
            <a href="../index.html" class="text-decoration-none small text-success">← Voltar para a página inicial</a>
        </div>
    </div>
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
